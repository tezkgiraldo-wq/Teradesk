# GENERADO por teradesk/generar-workflow.py - no editar a mano
name: TeraDesk - compilar Windows x64

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "teradesk"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.1"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "true"
  PUBLISH_UPDATE_METADATA: "false"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:
  validate-update-metadata-keys:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Checkout source code
      if: false
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
      with:
        persist-credentials: false

    - name: Install Python
      if: false
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      if: false
      run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

    - name: Test update metadata signer
      if: false
      run: |
        python -m unittest \
          res/update/test_generate_update_metadata.py \
          res/update/test_update_metadata_cli.py \
          res/update/test_macos_update_scripts.py

    - name: Validate update metadata keys
      if: false
      env:
        RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
        RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
      run: python res/update/generate_update_metadata.py check-key

  generate-bridge:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    needs: [validate-update-metadata-keys]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - {target: windows-2022, platform: x64}
    with:
      upload-artifact: true
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
        - {target: x86_64-pc-windows-msvc, os: windows-2022, arch: x86_64, flutter-arch: x64, vcpkg-triplet: x64-windows-static, build-args: "--vram"}
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410   # v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
      with:
        submodules: recursive

    - name: TeraDesk - server y llave propios
      shell: bash
      run: "set -e\nF=libs/hbb_common/src/config.rs\nsed -i -E 's|^pub const RENDEZVOUS_SERVERS: &\\[&str\\] = &\\[.*\\];|pub const RENDEZVOUS_SERVERS: \\&[\\&str] = \\&[\"teranetcloud.duckdns.org\"];|' $F\nsed -i -E 's|^pub const RS_PUB_KEY: &str = \".*\";|pub const RS_PUB_KEY: \\&str = \"v0S7TYOm3oRvy1FnRyfItdkG3pa21WG8+F3gXJfnTCg=\";|' $F\ngrep -n 'RENDEZVOUS_SERVERS\\|RS_PUB_KEY' $F\ngrep -q '\"teranetcloud.duckdns.org\"' $F && grep -q '\"v0S7TYOm3oRvy1FnRyfItdkG3pa21WG8+F3gXJfnTCg=\"' $F || { echo 'NO SE APLICO EL PARCHE'; exit 1; }\n"
    - name: TeraDesk - nombre e iconos propios
      shell: bash
      run: "set -e\nF=libs/hbb_common/src/config.rs\nsed -i 's|RwLock::new(\"RustDesk\".to_owned())|RwLock::new(\"TeraDesk\".to_owned())|' $F\ngrep -q 'RwLock::new(\"TeraDesk\".to_owned())' $F || { echo 'NO SE CAMBIO APP_NAME'; exit 1; }\ncp teradesk/marca/icon.ico res/icon.ico\ncp teradesk/marca/tray-icon.ico res/tray-icon.ico\ncp teradesk/marca/icon.png res/icon.png\ncp teradesk/marca/icon.ico flutter/windows/runner/resources/app_icon.ico\ncp teradesk/marca/icon.ico flutter/assets/icon.ico\ncp teradesk/marca/icon.png flutter/assets/icon.png\ncp teradesk/marca/logo.png teradesk/marca/logo_light.png teradesk/marca/logo_dark.png flutter/assets/\nD=flutter/lib/common.dart\nsed -i 's|if (bind.mainGetBuildinOption(key: \"hide-powered-by-me\") == .Y.) {|if (true) {|' $D\ngrep -q 'if (true) {' $D || { echo 'NO SE OCULTO powered_by'; exit 1; }\nR=flutter/windows/runner/Runner.rc\nsed -i -E 's|(VALUE \"ProductName\", )\"RustDesk\"|\\1\"TeraDesk\"|; s|(VALUE \"FileDescription\", )\"[^\"]*\"|\\1\"TeraDesk - Soporte remoto TeraNeT\"|' $R\ngrep -n 'ProductName\\|FileDescription' $R\n"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0   # v2.0.9
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Install flutter
      id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225    # v2.12.0; https://github.com/subosito/flutter-action/issues/277
      with:
        channel: "stable"
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64

    - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: |
        $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
        Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
        Write-Host "Flutter root: $flutterRoot"
        Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
        & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
        # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
        $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
        Write-Host $dartVer
        if ($dartVer -notmatch "windows_arm64") {
          Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
          exit 1
        }
        & "$flutterRoot\bin\flutter.bat" precache --windows
        # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
        # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
        $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
        Write-Host "Engine artifacts present:"
        Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
        if (-not (Test-Path "$engineDir\windows-arm64-release")) {
          Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
          exit 1
        }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

    - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi

    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is the only target on Flutter 3.44; apply its source/pubspec deltas on the fly
        # (shared with the 3.44 bridge job) so the committed sources stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
      with:
        prefix-key: ${{ matrix.job.os }}

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2   # v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash

    - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }

    - name: Run the Rust tests
        # x86_64 only: the tests are the same code on arm64, and that runner is the slow one.
      if: ${{ false && matrix.job.arch == 'x86_64' }}
      shell: bash
      run: |
        # The build's own features, so the tests see the code that ships.
        FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }} --print-features)
        cargo test --locked --release --lib --features "$FEATURES"
        # Its Windows tests run nowhere else.
        cargo test --locked --release -p clipboard

    - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi

    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      if: true
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: "./rustdesk"

    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: rustdesk

    - name: Sign rustdesk files
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: |
        pip3 install requests argparse
        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

    - name: Verify Windows Flutter version
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true'
      shell: powershell
      run: |
        $reportedVersion = (& ".\rustdesk\rustdesk.exe" --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) {
          throw "rustdesk --version exited with $LASTEXITCODE"
        }
        if ($reportedVersion -cne $env:VERSION) {
          throw "RustDesk reports version '$reportedVersion', expected '$env:VERSION'"
        }

    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: |
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        mv ../../rustdesk/rustdesk.exe ../../rustdesk/TeraDesk.exe
        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/TeraDesk.exe
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/TeraDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce   # v2
      with:
          # Select the MSBuild process architecture; -p:Platform sets the MSI target.
          # Native ARM64 tools give the compiler more address space for PCH files
          # (C3859/C1076 were reported by HostX86\arm64\CL.exe).
          # Keep the action's default x86 MSBuild for the existing x64 MSI job.
        msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}

    - name: Sign rustdesk self-extracted file
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: |
        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

    - name: Upload signed Windows Flutter EXE
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: windows-flutter-${{ matrix.job.arch }}-exe
        path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
        if-no-files-found: error

    - name: Upload signed Windows Flutter MSI
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.SIGN_BASE_URL != '-2'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: windows-flutter-${{ matrix.job.arch }}-msi
        path: ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
        if-no-files-found: error

    - name: Publish Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844   # v1
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: |
          ./SignOutput/TeraDesk-*.exe

  # The fallback for the flutter version, we use Sciter for 32bit Windows.
  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
        - {target: x86_64-apple-darwin, os: macos-15-intel, extra-build-args: "", extra-cargo-features: "", arch: x86_64, vcpkg-triplet: x64-osx}
        - {target: aarch64-apple-darwin, os: macos-14, extra-build-args: "--screencapturekit", extra-cargo-features: ",screencapturekit", arch: aarch64, vcpkg-triplet: arm64-osx}
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410   # v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
      with:
        submodules: recursive

    - name: TeraDesk - server y llave propios (Mac)
      shell: bash
      run: "set -e\nF=libs/hbb_common/src/config.rs\nsed -i '' -E 's|^pub const RENDEZVOUS_SERVERS: &\\[&str\\] = &\\[.*\\];|pub const RENDEZVOUS_SERVERS: \\&[\\&str] = \\&[\"teranetcloud.duckdns.org\"];|' $F\nsed -i '' -E 's|^pub const RS_PUB_KEY: &str = \".*\";|pub const RS_PUB_KEY: \\&str = \"v0S7TYOm3oRvy1FnRyfItdkG3pa21WG8+F3gXJfnTCg=\";|' $F\ngrep -n 'RENDEZVOUS_SERVERS\\|RS_PUB_KEY' $F\ngrep -q '\"teranetcloud.duckdns.org\"' $F && grep -q '\"v0S7TYOm3oRvy1FnRyfItdkG3pa21WG8+F3gXJfnTCg=\"' $F || { echo 'NO SE APLICO EL PARCHE'; exit 1; }\n"
    - name: TeraDesk - nombre e iconos propios (Mac)
      shell: bash
      run: "set -e\nF=libs/hbb_common/src/config.rs\nsed -i '' 's|RwLock::new(\"RustDesk\".to_owned())|RwLock::new(\"TeraDesk\".to_owned())|' $F\ngrep -q 'RwLock::new(\"TeraDesk\".to_owned())' $F || { echo 'NO SE CAMBIO APP_NAME'; exit 1; }\ncp teradesk/marca/icon.png res/icon.png\ncp teradesk/marca/icon.ico flutter/assets/icon.ico\ncp teradesk/marca/icon.png flutter/assets/icon.png\ncp teradesk/marca/logo.png teradesk/marca/logo_light.png teradesk/marca/logo_dark.png flutter/assets/\nD=flutter/lib/common.dart\nsed -i '' 's|if (bind.mainGetBuildinOption(key: \"hide-powered-by-me\") == .Y.) {|if (true) {|' $D\ngrep -q 'if (true) {' $D || { echo 'NO SE OCULTO powered_by'; exit 1; }\nX=flutter/macos/Runner/Configs/AppInfo.xcconfig\nsed -i '' -e 's|^PRODUCT_NAME = .*|PRODUCT_NAME = TeraDesk|' -e 's|^PRODUCT_BUNDLE_IDENTIFIER = .*|PRODUCT_BUNDLE_IDENTIFIER = com.teranet.teradesk|' $X\nP=flutter/macos/Runner/Info.plist\nsed -i '' -e 's|<string>com.carriez.rustdesk</string>|<string>com.teranet.teradesk</string>|' -e 's|<string>rustdesk</string>|<string>teradesk</string>|' $P\nsed -i '' 's|RustDesk.app|TeraDesk.app|g' build.py flutter/macos/Runner.xcodeproj/project.pbxproj\ncp teradesk/marca/AppIcon.icns flutter/macos/Runner/AppIcon.icns\ncp teradesk/marca/mac-icon.png res/mac-icon.png\ngrep -n 'PRODUCT_NAME\\|BUNDLE_IDENTIFIER' $X\ngrep -c 'TeraDesk.app' build.py\n"
    - name: Import the codesign cert
      if: env.MACOS_P12_BASE64 != null
      uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071   # v1
      with:
        p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
        p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
        keychain: rustdesk

    - name: Check sign and import sign key
      if: env.MACOS_P12_BASE64 != null
      run: |
        security default-keychain -s rustdesk.keychain
        security find-identity -v

    - name: Import notarize key
      if: env.MACOS_P12_BASE64 != null
      uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac   # v1.2
      with:
          # https://gregoryszorc.com/docs/apple-codesign/stable/apple_codesign_rcodesign.html#notarizing-and-stapling
        fileName: rustdesk.json
        fileDir: ${{ github.workspace }}
        encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

    - name: Install rcodesign tool
      if: env.MACOS_P12_BASE64 != null
      shell: bash
      run: |
        pushd /tmp
        wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
        tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz
        mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
        popd

    - name: Install build runtime
      run: |
        brew install llvm create-dmg
        # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
        if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
        else
            brew install pkg-config
        fi

    - name: Install NASM
      run: |
        # Install NASM 2.16.x from official release.
        # Do NOT use `brew install nasm` which installs NASM 3.x.
        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
        unzip nasm-2.16.03-macosx.zip
        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
        nasm --version

    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2   # v2
      with:
        channel: "stable"
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi

    - name: Workaround for flutter issue
      shell: bash
      run: |
        cd "$(dirname "$(which flutter)")"
        # https://github.com/flutter/flutter/issues/133533
        sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
        grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      with:
        toolchain: ${{ env.MAC_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
      with:
        prefix-key: ${{ matrix.job.os }}

    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: bridge-artifact
        path: ./

    - name: Run the Dart tests
      if: ${{ false && matrix.job.arch == 'aarch64' }}
      working-directory: flutter
      run: flutter test --timeout 60s

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2   # v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: |
        clang --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build rustdesk
      run: |
        if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
        fi
        ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

    - name: Test verified updates
      if: env.PUBLISH_UPDATE_METADATA == 'true'
      run: |
        python3 -m unittest res/update/test_macos_update_scripts.py
        cargo test --locked --release --lib platform::macos::update_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
        cargo test --locked --release --lib verified_dmg_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
        cargo test --locked --release --lib update_metadata::tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"

    - name: Run the Rust tests
      if: ${{ false && matrix.job.arch == 'aarch64' }}
      run: |
        # The build's own features, so the tests see the code that ships. MACOSX_DEPLOYMENT_TARGET
        # comes from the build step's export.
        FEATURES=$(./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }} --print-features)
        cargo test --locked --release --lib --features "$FEATURES"
        # Opt-in, and its macOS tests run nowhere else.
        cargo test --locked --release -p clipboard --features unix-file-copy-paste

    - name: TeraDesk - firmar con certificado propio (Mac)
      if: env.UPLOAD_ARTIFACT == 'true'
      shell: bash
      env:
        P12: ${{ secrets.TERADESK_MAC_P12 }}
        P12_PASS: ${{ secrets.TERADESK_MAC_P12_PASS }}
      run: "set -euo pipefail\n[ -n \"$P12\" ] || { echo '::error::falta el secret TERADESK_MAC_P12'; exit 1; }\nKC=\"$RUNNER_TEMP/teradesk.keychain-db\"; KCPASS=$(openssl rand -hex 16)\necho \"$P12\" | base64 --decode > \"$RUNNER_TEMP/firma.p12\"\nsecurity create-keychain -p \"$KCPASS\" \"$KC\"\nsecurity set-keychain-settings -lut 21600 \"$KC\"\nsecurity unlock-keychain -p \"$KCPASS\" \"$KC\"\nsecurity import \"$RUNNER_TEMP/firma.p12\" -k \"$KC\" -P \"$P12_PASS\" -T /usr/bin/codesign\nrm -f \"$RUNNER_TEMP/firma.p12\"\nsecurity set-key-partition-list -S apple-tool:,apple:,codesign: -s -k \"$KCPASS\" \"$KC\" >/dev/null\nsecurity list-keychains -d user -s \"$KC\" $(security list-keychains -d user | tr -d '\"')\nsecurity find-identity -p codesigning \"$KC\"\n# por huella SHA-1: el certificado es autofirmado y no sale como 'valido' en find-identity -v\nID=$(security find-certificate -c 'TeraNeT Computadores' -Z \"$KC\" | awk '/SHA-1 hash/{print $3}')\n[ -n \"$ID\" ] || { echo '::error::no se encontro el certificado en el keychain'; exit 1; }\nAPP=./flutter/build/macos/Build/Products/Release/TeraDesk.app\nbash ./.github/scripts/sign-macos-app.sh \"$APP\" \"$ID\" ./flutter/macos/Runner/Release.entitlements\ncodesign -dvv \"$APP\" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier'\necho 'Requisito designado (lo que Mac usa para amarrar los permisos):'\ncodesign -d -r- \"$APP\"\ncodesign -d -r- \"$APP\" 2>&1 | grep -q 'certificate' || { echo '::error::la firma no quedo amarrada al certificado'; exit 1; }\n"
    - name: create unsigned dmg
      if: env.UPLOAD_ARTIFACT == 'true'
      run: |
        CREATE_DMG="$(command -v create-dmg)"
        CREATE_DMG="$(readlink -f "$CREATE_DMG")"
        sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
        create-dmg --icon "TeraDesk.app" 200 190 --hide-extension "TeraDesk.app" --window-size 800 400 --app-drop-link 600 185 TeraDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/TeraDesk.app

    - name: Upload unsigned macOS app
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: rustdesk-unsigned-macos-${{ matrix.job.arch }}
        path: TeraDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg   # can not upload the directory directly or tar.gz, which destroy the link structure, causing the codesign failed

    - name: Codesign app and create signed dmg
      if: env.MACOS_P12_BASE64 != null && env.UPLOAD_ARTIFACT == 'true'
      run: |
        # Patch create-dmg to give more attempts to unmount image
        CREATE_DMG="$(command -v create-dmg)"
        CREATE_DMG="$(readlink -f "$CREATE_DMG")"
        sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
        # Unlock keychain
        security default-keychain -s rustdesk.keychain
        security unlock-keychain -p ${{ secrets.MACOS_P12_PASSWORD }} rustdesk.keychain
        # start sign the rustdesk.app and dmg
        rm -rf *.dmg || true
        # the identity secret carries its own shell quoting, so expand it inline like the dmg codesign below
        bash ./.github/scripts/sign-macos-app.sh \
          ./flutter/build/macos/Build/Products/Release/TeraDesk.app \
          ${{ secrets.MACOS_CODESIGN_IDENTITY }} \
          ./flutter/macos/Runner/Release.entitlements
        if [ "$PUBLISH_UPDATE_METADATA" = "true" ]; then
          reported_version="$(./flutter/build/macos/Build/Products/Release/TeraDesk.app/Contents/MacOS/TeraDesk --version)"
          if [ "$reported_version" != "$VERSION" ]; then
            echo "::error::RustDesk reports version '$reported_version', expected '$VERSION'"
            exit 1
          fi
        fi
        create-dmg --icon "TeraDesk.app" 200 190 --hide-extension "TeraDesk.app" --window-size 800 400 --app-drop-link 600 185 TeraDesk-${{ env.VERSION }}.dmg ./flutter/build/macos/Build/Products/Release/TeraDesk.app
        codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY }} --deep --strict TeraDesk-${{ env.VERSION }}.dmg -vvv
        # notarize the TeraDesk-${{ env.VERSION }}.dmg
        rcodesign notary-submit --api-key-path ${{ github.workspace }}/rustdesk.json  --staple TeraDesk-${{ env.VERSION }}.dmg

    - name: Rename rustdesk
      if: env.UPLOAD_ARTIFACT == 'true'
      shell: bash
      env:
        VERSION: ${{ env.VERSION }}
        ARCH: ${{ matrix.job.arch }}
      run: |
        if [ -f "TeraDesk-${VERSION}.dmg" ]; then
            mv "TeraDesk-${VERSION}.dmg" "TeraDesk-${VERSION}-${ARCH}.dmg"
        fi
        test -f "TeraDesk-${VERSION}-${ARCH}.dmg"

    - name: Upload signed macOS DMG
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA == 'true' && env.MACOS_P12_BASE64 != null
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: macos-${{ matrix.job.arch }}-dmg
        path: ./rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
        if-no-files-found: error

    - name: Publish DMG package
      if: env.UPLOAD_ARTIFACT == 'true' && env.PUBLISH_UPDATE_METADATA != 'true'
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844   # v1
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: |
          TeraDesk*-${{ matrix.job.arch }}.dmg

